name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 【新增】允许你在 Actions 页面手动点击按钮触发打包

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew # 【新增】赋予执行权限，必须加
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug -x lint # 【修改】用 ./gradlew，并且只打 Debug 包，跳过耗时的 lint 检查

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug # 【修改】产物名字改成 debug
        path: app/build/outputs/apk/debug/*.apk # 【修改】对应 debug 包的路径

        
